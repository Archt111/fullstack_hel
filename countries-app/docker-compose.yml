version: '3.8'
services:
  app:
    image: countries-frontend
    build:
      context: ./countries-frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api
    depends_on:
      - backend

  backend:
    image: countries-backend
    build:
      context: ./countries-backend
      dockerfile: Dockerfile
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  nginx:
    image: nginx:1.29-alpine
    ports:
      - 8081:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - backend
